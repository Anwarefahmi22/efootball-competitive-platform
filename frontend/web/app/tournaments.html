<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>البطولات — eFootball Arena</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Orbitron:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/shared/theme.css" />
</head>
<body>
  <div class="container">
    <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px">
      <h1 class="page-title">🏟️ البطولات</h1>
      <div style="display:flex; gap:10px; flex-wrap:wrap">
        <select class="field" id="filter-status" style="width:auto; min-width:150px">
          <option value="">كل الحالات</option>
          <option value="draft">مسودة</option>
          <option value="open" selected>مفتوحة للتسجيل</option>
          <option value="running">جارية</option>
          <option value="completed">منتهية</option>
          <option value="cancelled">ملغاة</option>
        </select>
        <button class="btn btn-ghost" id="btn-new" type="button">+ إنشاء بطولة</button>
      </div>
    </div>

    <div id="list" class="grid cols-3" style="margin-top:22px"></div>

    <!-- Create modal -->
    <dialog id="dlg-create" style="background:transparent; border:none; padding:0">
      <form class="card" id="form-create" method="dialog" style="width:min(480px,92vw); display:flex; flex-direction:column; gap:12px">
        <h3 style="color:var(--neon); font-family:'Orbitron'">بطولة جديدة</h3>
        <div><label class="lbl">اسم البطولة</label><input class="field" id="t-name" required /></div>
        <div><label class="lbl">الوصف (اختياري)</label><textarea class="field" id="t-desc" rows="2"></textarea></div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px">
          <div><label class="lbl">النظام</label>
            <select class="field" id="t-format">
              <option value="single_elimination">خروج المغلوب</option>
              <option value="league">دوري كامل</option>
            </select>
          </div>
          <div><label class="lbl">عدد المشاركين</label>
            <select class="field" id="t-max">
              <option>4</option><option>8</option><option selected>16</option><option>32</option><option>64</option>
            </select>
          </div>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px">
          <div><label class="lbl">رسوم الدخول</label><input class="field" id="t-fee" type="number" min="0" value="0" /></div>
          <div><label class="lbl">موافقة المنظم مطلوبة؟</label>
            <select class="field" id="t-approval"><option value="false">لا — انضمام مباشر</option><option value="true">نعم</option></select>
          </div>
        </div>
        <div class="err muted" id="t-err" style="color:var(--danger); font-size:.85rem"></div>
        <div style="display:flex; gap:10px; justify-content:flex-end">
          <button class="btn btn-ghost" id="t-cancel" type="button">إلغاء</button>
          <button class="btn btn-primary" type="submit">إنشاء</button>
        </div>
      </form>
    </dialog>
  </div>

  <script src="/shared/api.js"></script>
  <script src="/shared/nav.js"></script>
  <script>
    const fmtLabel = { single_elimination: "خروج المغلوب", league: "دوري" };

    function card(t) {
      const pct = t.max_participants ? Math.round((t.participant_count || 0) * 100 / t.max_participants) : 0;
      return `
      <div class="card hoverable">
        <div style="display:flex; justify-content:space-between; align-items:center">
          <h3 style="margin:0">${t.name}</h3>
          <span class="badge ${t.status}">${statusLabel(t.status)}</span>
        </div>
        <div class="muted" style="margin:8px 0 14px; font-size:.9rem">${(t.description || "بدون وصف").slice(0, 90)}</div>
        <div style="display:flex; gap:16px; font-size:.85rem; color:var(--muted)">
          <span>🎮 ${fmtLabel[t.format] || t.format}</span>
          <span>👥 ${t.participant_count}/${t.max_participants}</span>
          <span>💰 رسوم ${t.entry_fee}</span>
        </div>
        <div class="progress" style="margin:12px 0"><i style="width:${pct}%"></i></div>
        <div style="display:flex; gap:10px">
          ${t.status === "open" ? `<button class="btn btn-primary" style="flex:1; padding:9px" data-join="${t.id}">انضم الآن</button>` : ""}
          <button class="btn btn-ghost" style="flex:1; padding:9px" data-open="${t.id}">تفاصيل</button>
        </div>
      </div>`;
    }

    let caches = [];
    async function load() {
      el("list").innerHTML = `<div class="spinner"></div>`;
      const status = el("filter-status").value;
      try {
        let list = await apiFetch("/tournaments");
        caches = list;
        if (status) list = list.filter((t) => t.status === status);
        el("list").innerHTML = list.length
          ? list.map(card).join("")
          : `<div class="empty" style="grid-column:1/-1">لا توجد بطولات بهذه الحالة — <a href="#" id="first-create">أنشئ أول بطولة</a></div>`;
        document.querySelectorAll("[data-join]").forEach((b) => b.addEventListener("click", () => join(b.dataset.join)));
        el("first-create")?.addEventListener("click", (e) => { e.preventDefault(); openCreate(); });
      } catch (err) {
        el("list").innerHTML = `<div class="empty" style="grid-column:1/-1">${err.detail || "تعذر التحميل"}</div>`;
      }
    }

    async function join(id) {
      try {
        await apiFetch(`/tournaments/${id}/join`, { method: "POST", noBody: true });
        toast("تم الانضمام! 🎉");
        load();
      } catch (err) {
        toast(err.detail || "فشل الانضمام", "error");
      }
    }

    const dlg = document.getElementById("dlg-create");
    function openCreate() { dlg.showModal(); }
    el("btn-new").addEventListener("click", openCreate);
    el("t-cancel").addEventListener("click", () => dlg.close());
    el("filter-status").addEventListener("change", load);

    dlg.querySelector("#form-create").addEventListener("submit", async (e) => {
      e.preventDefault();
      el("t-err").textContent = "";
      const isLeague = el("t-format").value === "league";
      let maxp = parseInt(el("t-max").value, 10);
      if (isLeague && ![2, 4, 8, 16, 32, 64].includes(maxp)) maxp = 16; // quick fix: choose nearest allowed
      const body = {
        name: el("t-name").value.trim(),
        description: el("t-desc").value.trim() || null,
        format: el("t-format").value,
        max_participants: maxp,
        entry_fee: parseInt(el("t-fee").value || "0", 10),
        requires_approval: el("t-approval").value === "true",
      };
      try {
        await apiFetch("/tournaments", { method: "POST", body: JSON.stringify(body) });
        dlg.close();
        toast("تم إنشاء البطولة! 🏆");
        el("filter-status").value = "open";
        load();
      } catch (err) {
        el("t-err").textContent = err.detail || "فشل الإنشاء";
      }
    });

    render; // nav renders on DOMContentLoaded
    load();
    document.getElementById("form-create").id = "form-create";
  </script>
</body>
</html>
