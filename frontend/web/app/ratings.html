<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>التصنيف العام — eFootball Arena</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Orbitron:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/shared/theme.css" />
</head>
<body>
  <div class="container">
    <h1 class="page-title">📊 التصنيف العام (ELO)</h1>
    <div class="card" style="margin-top:16px; overflow-x:auto">
      <table class="table">
        <thead><tr><th>#</th><th>اللاعب</th><th>ELO</th><th>مباريات</th><th>فاز</th><th>خسر</th></tr></thead>
        <tbody id="body"></tbody>
      </table>
    </div>
  </div>
  <script src="/shared/api.js"></script>
  <script src="/shared/nav.js"></script>
  <script>
    (async () => {
      try {
        const rows = await apiFetch("/ratings/leaderboard");
        el("body").innerHTML = rows.map((r, i) => `
          <tr>
            <td class="num">${i + 1}</td>
            <td><a href="/app/profile.html?user=${r.user_id}">${r.display_name}</a></td>
            <td class="num" style="color:var(--neon)">${r.rating}</td>
            <td>${r.matches_played}</td>
            <td style="color:var(--neon)">${r.wins}</td>
            <td style="color:var(--danger)">${r.losses}</td>
          </tr>`).join("") || `<tr><td colspan="6" class="empty">لا يوجد لاعبون مصنفون بعد</td></tr>`;
      } catch (err) {
        el("body").innerHTML = `<tr><td colspan="6" class="empty">${err.detail || "تعذر التحميل"}</td></tr>`;
      }
    })();
  </script>
</body>
</html>
