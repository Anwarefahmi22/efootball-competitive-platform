<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>البطولات — eFootball Arena</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/shared/theme.css" />
  <link rel="icon" type="image/png" sizes="32x32" href="/shared/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/shared/favicon-192.png" />
  <link rel="apple-touch-icon" href="/shared/favicon-192.png" />
</head>
<body>
  <div class="container">
    <div class="page-toolbar">
      <h1 class="page-title">🏟️ البطولات</h1>
      <div class="toolbar-actions">
        <select class="field" id="filter-status">
          <option value="" selected>كل الحالات</option>
          <option value="registration_open">مفتوحة للتسجيل</option>
          <option value="registration_closed">التسجيل مغلق</option>
          <option value="in_progress">جارية</option>
          <option value="completed">منتهية</option>
          <option value="cancelled">ملغاة</option>
        </select>
        <button class="btn btn-primary" id="btn-new" type="button">+ إنشاء بطولة</button>
      </div>
    </div>

    <div id="list" class="grid cols-3 page-list"><div class="empty card grid-span">جارٍ تحميل البطولات…</div></div>

    <!-- Create modal -->
    <dialog id="dlg-create" aria-labelledby="create-title" style="background:transparent; border:none; padding:0">
      <form class="card dialog-form" id="form-create" method="dialog">
        <h3 id="create-title" class="accent-text">بطولة جديدة</h3>
        <div><label class="lbl" for="t-name">اسم البطولة</label><input class="field" id="t-name" name="name" required /></div>
        <div><label class="lbl" for="t-desc">الوصف (اختياري)</label><textarea class="field" id="t-desc" name="description" rows="2"></textarea></div>
        <div class="form-grid">
          <div><label class="lbl" for="t-format">النظام</label>
            <select class="field" id="t-format">
              <option value="single_elimination">خروج المغلوب</option>
              <option value="league">دوري كامل</option>
              <option value="group_knockout">مجموعات وإقصائيات</option>
            </select>
          </div>
          <div><label class="lbl" for="t-max">عدد المشاركين</label>
            <select class="field" id="t-max">
              <option>4</option><option>8</option><option selected>16</option><option>32</option><option>64</option>
            </select>
          </div>
          <div id="t-groups-wrap" hidden><label class="lbl" for="t-groups">عدد المجموعات</label>
            <select class="field" id="t-groups">
              <option>2</option><option selected>4</option><option>8</option>
            </select>
          </div>
        </div>
        <div>
          <label class="lbl" for="t-approval">موافقة المنظم مطلوبة؟</label>
            <select class="field" id="t-approval"><option value="false">لا — انضمام مباشر</option><option value="true">نعم</option></select>
        </div>
        <div>
          <label class="lbl" for="t-room">مجموعة البطولة</label>
            <select class="field" id="t-room"><option value="true" selected>نعم — تُنشأ مع البطولة</option><option value="false">لا — بدون مجموعة</option></select>
        </div>
        <div class="err muted error-text" id="t-err"></div>
        <div class="form-actions">
          <button class="btn btn-ghost" id="t-cancel" type="button">إلغاء</button>
          <button class="btn btn-primary" type="submit">إنشاء</button>
        </div>
      </form>
    </dialog>
  </div>

  <script src="/shared/i18n.js"></script>
  <script src="/shared/api.js"></script>
  <script src="/shared/nav.js"></script>
  <script src="/shared/presence.js"></script>
  <script>
    const fmtLabel = { single_elimination: "خروج المغلوب", league: "دوري", group_knockout: "مجموعات وإقصائيات" };
    const numberFormat = new Intl.NumberFormat(i18n.current() === "ar" ? "ar-EG" : i18n.current());

    const FORMAT_ICON = {
      single_elimination: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h3v4H4z"/><path d="M4 15h3v4H4z"/><path d="M17 10h3v4h-3z"/><path d="M7 7h4v5"/><path d="M7 17h4v-5"/><path d="M11 12h6"/></svg>',
      league: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9.3h18"/><path d="M3 14.6h18"/><path d="M9 4v16"/></svg>',
      group_knockout: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>'
    };
    function card(t) {
      const pct = t.max_participants ? Math.round((t.participant_count || 0) * 100 / t.max_participants) : 0;
      // A full tournament is not joinable even while its status is still
      // registration_open: show the full state and drop the join CTA
      // (QA audit 2026-10-31: full cups invited joins the server rejects).
      const isFull = (t.participant_count || 0) >= t.max_participants;
      const membership = t.created_by === currentUserId
        ? `<span class="membership-status is-organizer">◆ أنت المنظم</span>`
        : t.participants.some((participant) => participant.user_id === currentUserId && participant.status === "approved")
          ? `<span class="membership-status is-joined">✓ أنت منضم</span>`
          : t.participants.some((participant) => participant.user_id === currentUserId)
            ? `<span class="membership-status is-pending">◷ قيد المراجعة</span>` : "";
      return `
      <article class="card hoverable tournament-card">
        <div class="tcard-band st-${escapeHtml(t.status)}">
          <span class="tcard-band__icon">${FORMAT_ICON[t.format] || ""}</span>
          <span class="tcard-band__fmt">${fmtLabel[t.format] || escapeHtml(t.format)}</span>
          ${t.status === "registration_open" && isFull ? `<span class="badge full">ممتلئة</span>` : `<span class="badge ${escapeHtml(t.status)}">${statusLabel(t.status)}</span>`}
        </div>
        <div class="tournament-card__head">
          <h2>${escapeHtml(t.name)}</h2>
        </div>
        <p class="tournament-card__description">${escapeHtml((t.description || "بطولة جديدة بانتظار المنافسين.").slice(0, 110))}</p>
        <div class="tournament-card__meta">
          <span>👥 ${numberFormat.format(t.participant_count || 0)}/${numberFormat.format(t.max_participants)}</span>
          <span>🆓 مجانية بالكامل</span>
        </div>
        <div class="tournament-card__prize"><span>المنافسة</span><strong>نقاط وتصنيف</strong></div>
        <div class="tournament-card__footer"><span class="fill-ring" role="img" aria-label="نسبة امتلاء البطولة ${numberFormat.format(pct)}%"><svg viewBox="0 0 44 44" aria-hidden="true"><circle class="fill-ring__track" cx="22" cy="22" r="18"/><circle class="fill-ring__arc" cx="22" cy="22" r="18" stroke-dasharray="${(pct * 113.1 / 100).toFixed(1)} 113.1"/></svg><b>${numberFormat.format(pct)}%</b></span>${membership}
          ${t.status === "registration_open" && !isFull && t.created_by !== currentUserId ? `<button class="btn btn-primary" type="button" data-join="${t.id}">انضم الآن</button>` : ""}
          <a class="btn btn-ghost" href="/app/tournament.html?id=${encodeURIComponent(t.id)}">${t.created_by === currentUserId ? "إدارة البطولة" : "التفاصيل"}</a>
        </div>
      </article>`;
    }

    let caches = [];
    let currentUserId = localStorage.getItem(USER_KEY);
    async function load() {
      el("list").innerHTML = `<div class="spinner"></div>`;
      const status = el("filter-status").value;
      try {
        let list = await apiFetch("/tournaments");
        caches = list;
        if (status) list = list.filter((t) => t.status === status);
        el("list").innerHTML = list.length
          ? list.map(card).join("")
          : `<div class="empty-rich card grid-span">
              <svg class="empty-rich__art" viewBox="0 0 120 64" aria-hidden="true"><path d="M8 56a52 40 0 0 1 104 0" fill="none" stroke="#a3ff12" stroke-width="2"/><path d="M26 56a34 24 0 0 1 68 0" fill="none" stroke="#a3ff12" stroke-opacity=".45" stroke-width="2"/><line x1="4" y1="56" x2="116" y2="56" stroke="#a3ff12" stroke-opacity=".45" stroke-width="2"/></svg>
              <h2>لا توجد بطولات بهذه الحالة</h2>
              <p>الساحة بانتظار أول بطولة — أنشئ واحدة وادعُ المنافسين، أو جرّب حالة تصفية أخرى.</p>
              <button class="btn btn-primary" id="first-create" type="button">+ أنشئ بطولة</button>
              <div class="format-grid">
                <article class="format-card">
                  <span class="format-card__icon">${FORMAT_ICON.single_elimination}</span>
                  <h3>خروج المغلوب</h3>
                  <p>خسارة واحدة تعني الخروج — طريق قصير وحاسم نحو اللقب.</p>
                  <small>4 إلى 64 لاعبًا · إقصاء مباشر</small>
                  <button class="btn btn-ghost" type="button" data-create-format="single_elimination">إنشاء بهذا النظام</button>
                </article>
                <article class="format-card">
                  <span class="format-card__icon">${FORMAT_ICON.league}</span>
                  <h3>دوري كامل</h3>
                  <p>الكل يواجه الكل، والنقاط وفارق الأهداف يحسمان الصدارة.</p>
                  <small>حتى 64 لاعبًا · جدول كامل</small>
                  <button class="btn btn-ghost" type="button" data-create-format="league">إنشاء بهذا النظام</button>
                </article>
                <article class="format-card">
                  <span class="format-card__icon">${FORMAT_ICON.group_knockout}</span>
                  <h3>مجموعات وإقصائيات</h3>
                  <p>دور مجموعات أولًا ثم إقصائيات — تجربة البطولات الكبرى.</p>
                  <small>2 أو 4 أو 8 مجموعات</small>
                  <button class="btn btn-ghost" type="button" data-create-format="group_knockout">إنشاء بهذا النظام</button>
                </article>
              </div>
            </div>`;
        document.querySelectorAll("[data-join]").forEach((b) => b.addEventListener("click", () => join(b.dataset.join)));
        el("first-create")?.addEventListener("click", () => openCreate());
        document.querySelectorAll("[data-create-format]").forEach((b) => b.addEventListener("click", () => { el("t-format").value = b.dataset.createFormat; syncFormatFields(); openCreate(); }));
      } catch (err) {
        el("list").innerHTML = `<div class="empty grid-span" role="alert">${escapeHtml(err.detail || "تعذر التحميل")}</div>`;
      }
    }

    async function join(id) {
      try {
        await apiFetch(`/tournaments/${id}/join`, { method: "POST", noBody: true });
        toast("تم الانضمام! 🎉");
        load();
      } catch (err) {
        toast(err.detail || "فشل الانضمام", "error");
      }
    }

    const dlg = document.getElementById("dlg-create");
    // num_groups only applies to group_knockout (see POST /tournaments), so the
    // field is shown only for that format.
    function syncFormatFields() {
      el("t-groups-wrap").hidden = el("t-format").value !== "group_knockout";
    }
    el("t-format").addEventListener("change", syncFormatFields);
    function openCreate() { syncFormatFields(); dlg.showModal(); }
    el("btn-new").addEventListener("click", openCreate);
    el("t-cancel").addEventListener("click", () => dlg.close());
    el("filter-status").addEventListener("change", load);
    // One-shot flash message carried across a redirect (e.g. after deleting a
    // tournament on its own page — a toast cannot survive navigation by itself).
    const flashToast = sessionStorage.getItem("efa_flash_toast");
    if (flashToast) { sessionStorage.removeItem("efa_flash_toast"); toast(flashToast, "info", 9000); }

    dlg.querySelector("#form-create").addEventListener("submit", async (e) => {
      e.preventDefault();
      el("t-err").textContent = "";
      const isLeague = el("t-format").value === "league";
      const isGroupKnockout = el("t-format").value === "group_knockout";
      let maxp = parseInt(el("t-max").value, 10);
      if (isLeague && ![2, 4, 8, 16, 32, 64].includes(maxp)) maxp = 16; // quick fix: choose nearest allowed
      const body = {
        name: el("t-name").value.trim(),
        description: el("t-desc").value.trim() || null,
        format: el("t-format").value,
        max_participants: maxp,
        entry_fee: 0,
        requires_approval: el("t-approval").value === "true",
        create_room: el("t-room").value === "true",
      };
      if (isGroupKnockout) {
        // Mirrors the backend rules: num_groups must be a power of 2 and the
        // tournament must hold at least 2 players per group.
        const numGroups = parseInt(el("t-groups").value, 10);
        if (maxp < numGroups * 2) {
          el("t-err").textContent = "عدد المشاركين يجب أن يكون ضعف عدد المجموعات على الأقل.";
          return;
        }
        body.num_groups = numGroups;
      }
      try {
        const created = await apiFetch("/tournaments", { method: "POST", body: JSON.stringify(body) });
        dlg.close();
        toast("تم إنشاء البطولة! 🏆");
        location.href = `/app/tournament.html?id=${encodeURIComponent(created.id)}`;
      } catch (err) {
        el("t-err").textContent = err.detail || "فشل الإنشاء";
      }
    });

    apiFetch("/auth/me").then((me) => { currentUserId = me.id; localStorage.setItem(USER_KEY, me.id); }).catch(() => {}).finally(load);
    document.getElementById("form-create").id = "form-create";
  </script>
</body>
</html>
