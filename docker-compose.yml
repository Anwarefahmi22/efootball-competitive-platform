services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: efootball
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d efootball"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The API serves the web frontend itself — one container for everything.
  # Open http://localhost:8000/ directly; the nginx service below is only
  # kept for the legacy split-dev setup.
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/efootball
      JWT_SECRET_KEY: dev-secret-change-in-production
    ports:
      - "8000:8000"

  web:
    image: nginx:alpine
    depends_on:
      - api
    profiles: ["legacy"]
    ports:
      - "8080:80"
    volumes:
      - ./frontend/web:/usr/share/nginx/html:ro

volumes:
  pgdata:
