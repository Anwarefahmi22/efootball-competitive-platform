<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ملف اللاعب — eFootball Arena</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Orbitron:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/shared/theme.css" />
</head>
<body>
  <div class="container" style="max-width:800px">
    <div class="card" id="pcard">
      <div class="spinner"></div>
    </div>
  </div>
  <script src="/shared/api.js"></script>
  <script src="/shared/nav.js"></script>
  <script>
    (async () => {
      const uid = new URLSearchParams(location.search).get("user");
      if (!uid) { el("pcard").innerHTML = `<div class="empty">لم يُحدد اللاعب — <a href="/app/ratings.html">اذهب إلى التصنيف</a></div>`; return; }
      try {
        const [p, trust, rating] = await Promise.all([
          apiFetch("/users/" + uid),
          apiFetch("/trust/" + uid).catch(() => null),
          apiFetch("/ratings/" + uid).catch(() => null),
        ]);
        el("pcard").innerHTML = `
          <div style="display:flex; align-items:center; gap:18px; flex-wrap:wrap">
            <div style="width:84px; height:84px; border-radius:50%; background:#0a1a11; display:flex; align-items:center; justify-content:center; font-size:2.4rem; border:2px solid var(--neon-dim)">⚽</div>
            <div style="flex:1">
              <h2 style="margin:0; color:var(--neon)">${p.display_name}</h2>
              <div class="muted" style="margin-top:6px">${p.country || "🌍 دولة غير محددة"} · IGN: ${p.efootball_ign || "—"} · منذ ${new Date(p.created_at).toLocaleDateString("ar")}</div>
            </div>
            <div style="text-align:center">
              <div class="stat-value num">${rating ? rating.rating : "—"}</div>
              <div class="stat-label">ELO</div>
            </div>
          </div>
          ${p.bio ? `<p class="muted" style="margin-top:16px">${p.bio}</p>` : ""}
          <div class="grid cols-3" style="margin-top:18px">
            <div class="card"><span class="badge">${trust ? trust.trust_score + " ثقة" : "ثقة: —"}</span></div>
            <div class="card"><span class="badge">${rating ? "مباريات: " + rating.matches_played : ""}</span></div>
            <div class="card"><span class="badge">${rating ? rating.wins + " فوز / " + rating.losses + " خسارة" : ""}</span></div>
          </div>`;
      } catch (err) {
        el("pcard").innerHTML = `<div class="empty">${err.detail || "تعذر تحميل الملف"}</div>`;
      }
    })();
  </script>
</body>
</html>
