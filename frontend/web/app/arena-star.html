<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1e13" />
  <title>أرينا ستار — eFootball Arena</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Orbitron:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/shared/theme.css" />
  <link rel="icon" type="image/png" sizes="32x32" href="/shared/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/shared/favicon-192.png" />
  <link rel="apple-touch-icon" href="/shared/favicon-192.png" />
  <style>
    /* Arena Star fan deck — mechanic approved in the standalone v2 demo:
       cards pivot from the bottom in a fan, the front card glides out
       sideways, then the deck reshuffles once (.5s cubic-bezier(.4,0,.2,1)).
       Card face follows the user's reference mock element for element:
       id row + verified pill, big name/title beside a large avatar,
       stats row, MY SQUAD panel with a strength strip, cups row, the
       two invite buttons with the circular next button on their seam,
       and a quiet share/like bottom row.
       Classes are st- prefixed: theme.css owns .card/.btn/.avatar names. */
    .st-wrap { display: flex; flex-direction: column; align-items: center; }
    .st-deck {
      position: relative; margin-top: 20px;
      width: min(94vw, 400px); aspect-ratio: 0.54;
      /* min-height = the card's true content minimum (fixed rows ~433px
         + the framed squad-image slot 140px): nothing clips or overlaps;
         on short viewports the page scrolls instead. */
      max-height: calc(100dvh - 272px); min-height: 575px;
    }
    .st-card {
      position: absolute; inset: 0; border-radius: 20px; overflow: hidden;
      background: linear-gradient(170deg, #0c1d2e 0%, #071322 55%, #040b13 100%);
      border: 1px solid rgba(163, 255, 18, .32);
      box-shadow: 0 18px 44px rgba(0, 0, 0, .55);
      padding: 16px 16px 12px; display: flex; flex-direction: column; gap: 9px;
      transform-origin: 50% 106%;
      transition: transform .5s cubic-bezier(.4, 0, .2, 1), opacity .3s ease;
      user-select: none; -webkit-user-select: none; touch-action: pan-y;
      pointer-events: none; will-change: transform;
    }
    .st-card.front { pointer-events: auto; }
    .st-idrow {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      font-size: .74rem; color: #8fa6bb; font-weight: 700; letter-spacing: .05em; flex: none;
    }
    .st-verified {
      color: var(--neon); background: #0f3520; border: 1px solid rgba(163, 255, 18, .45);
      border-radius: 999px; padding: 3px 11px; font-size: .68rem; font-weight: 800; letter-spacing: .03em;
    }
    .st-me {
      color: #08130a; background: var(--neon); border-radius: 999px;
      padding: 3px 11px; font-size: .68rem; font-weight: 800;
    }
    .st-head { display: flex; align-items: center; gap: 14px; flex: none; }
    .st-headtx { flex: 1 1 auto; min-width: 0; }
    .st-avatar {
      width: 84px; height: 84px; border-radius: 50%; flex: none; overflow: hidden;
      display: grid; place-items: center; color: var(--neon);
      background: radial-gradient(circle at 35% 30%, #274b63, #101f30);
      border: 2px solid rgba(163, 255, 18, .5);
    }
    .st-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .st-avatar svg { width: 46px; height: 46px; }
    .st-name { font-size: 1.72rem; font-weight: 800; line-height: 1.12; overflow-wrap: anywhere; }
    .st-name a { color: inherit; text-decoration: none; }
    .st-title { color: var(--neon); font-weight: 800; font-size: 1.02rem; font-style: italic; }
    .st-meta { color: #8fa6bb; font-size: .8rem; }
    .st-divider { height: 1px; background: rgba(163, 255, 18, .16); flex: none; }
    .st-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; text-align: center; flex: none; }
    .st-stat b { display: block; font-size: 1.9rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
    .st-stat b.elo { color: var(--neon); }
    .st-stat span { color: #8fa6bb; font-size: .72rem; font-weight: 700; }
    .st-squad-head { font-size: 1.02rem; font-weight: 800; flex: none; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .st-squad-meta { color: var(--neon); font-size: .84rem; font-weight: 800; white-space: nowrap; }
    .st-squad {
      flex: 1 1 auto; min-height: 140px; display: flex; flex-direction: column;
      background: linear-gradient(180deg, #0a2013, #071a0f); justify-content: center;
      border: 1px solid rgba(163, 255, 18, .28); border-radius: 16px; padding: 10px;
      overflow: hidden;
    }
    .st-squad-img {
      width: 100%; height: 120px; object-fit: contain;
      border-radius: 10px; display: block; background: #04140a; flex: none;
    }
    .st-squad-text {
      flex: 1 1 auto; min-height: 108px; border: 1px solid rgba(163, 255, 18, .28); border-radius: 16px;
      background: #0a2013; display: grid; place-items: center; text-align: center; padding: 14px 8px;
    }
    .st-squad-text b { color: var(--neon); font-size: 1.5rem; display: block; }
    .st-squad-empty {
      flex: 1 1 auto; min-height: 108px; border: 1.5px dashed rgba(163, 255, 18, .3); border-radius: 16px;
      color: #8fa6bb; display: grid; place-items: center;
      font-size: .82rem; font-weight: 700; padding: 16px 8px; text-align: center;
    }
    .st-squad-empty a { color: var(--neon); }
    .st-cups { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 1.05rem; flex: none; }
    .st-cups .n { color: var(--neon); font-size: 1.25rem; font-variant-numeric: tabular-nums; }
    .st-cups .lbl { color: #8fa6bb; font-size: .78rem; font-weight: 700; margin-inline-start: auto; }
    .st-invites { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; flex: none; }
    .st-inv {
      border-radius: 14px; padding: 10px 6px 9px; min-height: 62px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
      font: inherit; font-weight: 800; font-size: .92rem; cursor: pointer; text-decoration: none;
    }
    .st-inv .ic { font-size: 1.25rem; line-height: 1; }
    .st-inv.primary { background: var(--neon); color: #0a1403; border: none; }
    .st-inv.ghost { background: transparent; color: var(--neon); border: 1.5px solid var(--neon); }
    .st-next-circle {
      position: absolute; left: 50%; bottom: -24px; transform: translateX(-50%); z-index: 3;
      width: 48px; height: 48px; border-radius: 50%; border: none; cursor: pointer;
      background: #1b2f42; color: #fff; display: grid; place-items: center;
      box-shadow: 0 6px 18px rgba(0, 0, 0, .5);
    }
    .st-next-circle svg { width: 22px; height: 22px; }
    .st-bottom { display: flex; justify-content: space-between; align-items: center; flex: none; }
    .st-mini {
      background: none; border: none; color: #8fa6bb; font: inherit; font-size: .85rem;
      font-weight: 700; cursor: pointer; display: flex; gap: 6px; align-items: center;
      padding: 6px 2px; min-height: 36px;
    }
    .st-mini.liked { color: #ff5d7a; }
    .st-mini.static { cursor: default; }
    .st-controls { display: flex; align-items: center; gap: 16px; margin-top: 18px; }
    .st-nav-btn {
      width: 46px; height: 46px; border-radius: 50%; border: 1.5px solid var(--neon);
      background: transparent; color: var(--neon); font-size: 1.05rem; cursor: pointer;
      display: grid; place-items: center; flex: none;
    }
    .st-counter { color: var(--muted); font-size: .85rem; font-weight: 700; min-width: 128px; text-align: center; }
    .st-counter b { color: var(--text); }
    .st-hint { color: var(--muted); font-size: .74rem; margin-top: 8px; text-align: center; }
    .st-state { text-align: center; color: var(--muted); padding: 48px 16px; font-weight: 700; }
    .st-modal {
      position: fixed; inset: 0; z-index: 200; display: grid; place-items: center;
      background: rgba(2, 8, 5, .66); padding: 18px;
    }
    .st-modal[hidden] { display: none; }
    .st-modal-box {
      width: min(92vw, 380px); background: #0c1d2e; color: var(--text);
      border: 1px solid rgba(163, 255, 18, .35); border-radius: 16px; padding: 16px;
    }
    .st-modal-box h3 { margin: 0 0 10px; font-size: 1rem; }
    .st-modal-item {
      display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%;
      text-align: start; background: #0a2a18; border: 1px solid var(--line); color: var(--text);
      border-radius: 10px; padding: 10px 12px; margin-bottom: 8px;
      font: inherit; font-weight: 700; cursor: pointer;
    }
    .st-modal-item .cnt { color: var(--muted); font-size: .78rem; font-weight: 700; }
    @media (max-height: 760px) {
      .st-deck { min-height: 520px; }
      .st-squad { min-height: 120px; }
      .st-squad-img { height: 100px; }
      .st-squad-text, .st-squad-empty { min-height: 96px; }
      .st-card { gap: 7px; padding: 13px 13px 10px; }
      .st-avatar { width: 66px; height: 66px; }
      .st-avatar svg { width: 36px; height: 36px; }
      .st-name { font-size: 1.38rem; }
      .st-title { font-size: .92rem; }
      .st-stat b { font-size: 1.5rem; }
      .st-inv { min-height: 54px; padding: 7px 6px 6px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="page-heading">
      <div>
        <span class="eyebrow">ساحة المنافسة</span>
        <h1 class="page-title">⭐ أرينا ستار</h1>
        <p class="muted">كومة بطاقات اللاعبين — مرّر لتكتشف نجوم الساحة، وأعجب بمن يلفت نظرك.</p>
      </div>
    </div>
    <div id="st-state" class="st-state">جارٍ تحميل البطاقات…</div>
    <div class="st-wrap" id="st-wrap" hidden>
      <div class="st-deck" id="st-deck"></div>
      <div class="st-controls">
        <button class="st-nav-btn" id="st-prev" type="button" aria-label="البطاقة السابقة">→</button>
        <div class="st-counter" id="st-counter"></div>
        <button class="st-nav-btn" id="st-next" type="button" aria-label="البطاقة التالية">←</button>
      </div>
      <p class="st-hint">انقر على الكومة أو اسحب أفقيًا لتدويرها — البطاقة الأمامية فقط تفاعلية</p>
    </div>
  </div>
  <div class="st-modal" id="st-inv-modal" hidden>
    <div class="st-modal-box">
      <h3 id="st-inv-title">دعوة إلى بطولة</h3>
      <div id="st-inv-list"></div>
      <button class="btn btn-ghost" id="st-inv-close" type="button">إغلاق</button>
    </div>
  </div>
  <script src="/shared/i18n.js"></script>
  <script src="/shared/api.js"></script>
  <script src="/shared/nav.js"></script>
  <script>
    const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[char]));
    const stTitleFor = (elo) => elo >= 1300 ? "أسطورة الساحة" : elo >= 1150 ? "محترف" : elo >= 1050 ? "منافس شرس" : elo >= 950 ? "منافس" : "صاعد";
    const stPersonSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>`;
    const stAvatarHtml = (p) => p.avatar_url ? `<img src="${escapeHtml(p.avatar_url)}" alt="" />` : stPersonSvg;

    function stSquadMetaHtml(p) {
      const bits = [];
      if (p.formation) bits.push(escapeHtml(p.formation));
      if (p.squad_strength != null) bits.push(`القوة الجماعية ${p.squad_strength}`);
      return bits.length ? `<span class="st-squad-meta">${bits.join(" · ")}</span>` : "";
    }
    function stSquadHtml(p) {
      if (p.squad_image_url) {
        return `<div class="st-squad"><img class="st-squad-img" src="${escapeHtml(p.squad_image_url)}" alt="تشكيلة اللاعب" loading="lazy" /></div>`;
      }
      return p.is_me
        ? `<div class="st-squad-empty"><span>لم تضف صورة تشكيلتك بعد — <a href="/app/dashboard.html">أضفها من تعديل الهوية</a></span></div>`
        : `<div class="st-squad-empty">لا توجد صورة تشكيلة بعد — هذا اللاعب لم يضف لقطة تشكيلته</div>`;
    }

    function stCardHtml(p, idx) {
      const winRate = p.matches_played ? Math.round((p.wins / p.matches_played) * 100) : 0;
      const meta = [p.country, p.efootball_ign ? "@" + p.efootball_ign : null].filter(Boolean).join(" · ") || "لاعب جديد في الساحة";
      const badge = p.is_verified
        ? `<span class="st-verified">✓ لاعب موثّق</span>`
        : (p.is_me ? `<span class="st-me">أنت</span>` : "");
      const invites = p.is_me
        ? `<button class="st-inv primary" type="button" data-act="share" data-uid="${p.user_id}"><span class="ic">↗</span>مشاركة بطاقتي</button>
           <a class="st-inv ghost" href="/app/dashboard.html"><span class="ic">✎</span>تعديل الهوية</a>`
        : `<button class="st-inv primary" type="button" data-act="invite-match" data-uid="${p.user_id}"><span class="ic">⚔</span>دعوة مباراة</button>
           <button class="st-inv ghost" type="button" data-act="invite-tournament" data-uid="${p.user_id}"><span class="ic">🏆</span>دعوة بطولة</button>`;
      const like = p.is_me
        ? `<span class="st-mini static">♡ <span>${p.likes_count}</span> · بطاقتك</span>`
        : `<button class="st-mini${p.liked_by_me ? " liked" : ""}" type="button" data-act="like" data-uid="${p.user_id}">${p.liked_by_me ? "♥" : "♡"} <span>${p.likes_count}</span></button>`;
      return `
      <div class="st-idrow"><span>ARENA ID #${p.arena_no}</span>${badge}</div>
      <div class="st-head">
        <div class="st-headtx">
          <div class="st-name"><a href="/app/profile.html?user=${encodeURIComponent(p.user_id)}">${escapeHtml(p.display_name)}</a></div>
          <div class="st-title">${stTitleFor(p.rating)}</div>
          <div class="st-meta">${escapeHtml(meta)}</div>
        </div>
        <div class="st-avatar">${stAvatarHtml(p)}</div>
      </div>
      <div class="st-divider"></div>
      <div class="st-stats">
        <div class="st-stat"><b>${p.matches_played}</b><span>مباراة</span></div>
        <div class="st-stat"><b>${winRate}%</b><span>نسبة الفوز</span></div>
        <div class="st-stat"><b class="elo">${p.rating}</b><span>تقييم ELO</span></div>
      </div>
      <div class="st-divider"></div>
      <div class="st-squad-head">تشكيلتي${stSquadMetaHtml(p)}</div>
      ${stSquadHtml(p)}
      <div class="st-cups">🏆 <span class="n">${String(p.cups).padStart(2, "0")}</span><span class="lbl">بطولات فاز بها</span></div>
      <div class="st-invites">
        ${invites}
        <button class="st-next-circle" type="button" data-act="next" aria-label="البطاقة التالية"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v16m0 0 6-6m-6 6-6-6"/></svg></button>
      </div>
      <div class="st-bottom">
        <button class="st-mini" type="button" data-act="share" data-uid="${p.user_id}">↗ مشاركة البطاقة</button>
        ${like}
      </div>`;
    }

    let stCards = [], stEls = [], stOrder = [];
    function stPosStyle(pos) {
      if (pos === 0) return { t: "rotate(0deg) translate(0px, 0px) scale(1)", z: 100, o: 1 };
      if (pos <= 4) return { t: `rotate(${-pos * 5}deg) translate(${-pos * 5}px, ${pos * 3}px) scale(${1 - pos * 0.015})`, z: 100 - pos, o: 1 };
      return { t: "rotate(-25deg) translate(-25px, 15px) scale(.92)", z: 0, o: 0 };
    }
    function stLayout() {
      stOrder.forEach((pi, pos) => {
        const elm = stEls[pi], s = stPosStyle(pos);
        elm.style.transform = s.t;
        elm.style.zIndex = s.z;
        elm.style.opacity = s.o;
        elm.classList.toggle("front", pos === 0);
      });
      const f = stCards[stOrder[0]];
      el("st-counter").innerHTML = `<b>${escapeHtml(f.display_name)}</b> · ${stOrder[0] + 1} / ${stCards.length}`;
    }
    let stGliding = false;
    function stCycle(dir) {
      if (stCards.length < 2) return;
      if (dir < 0) { stOrder.unshift(stOrder.pop()); stLayout(); return; }
      if (stGliding) return;
      stGliding = true;
      const front = stEls[stOrder[0]];
      front.style.transform = "translateX(-135%) rotate(-9deg)";
      front.style.opacity = "0.9";
      setTimeout(() => {
        front.style.transition = "none";
        stOrder.push(stOrder.shift());
        stLayout();
        void front.offsetWidth;
        front.style.transition = "";
        stGliding = false;
      }, 180);
    }

    function stShare(title, text, url) {
      if (navigator.share) {
        navigator.share({ title, text, url }).catch(() => {});
      } else if (navigator.clipboard) {
        navigator.clipboard.writeText(`${text}\n${url}`)
          .then(() => toast("تم نسخ نص الدعوة — أرسله للاعب"))
          .catch(() => toast(url));
      } else {
        toast(url);
      }
    }
    const stMyCard = () => stCards.find((c) => c.is_me);

    const invModal = el("st-inv-modal"), invList = el("st-inv-list"), invTitle = el("st-inv-title");
    async function stOpenInviteModal(card) {
      const me = stMyCard();
      invTitle.textContent = `دعوة ${card.display_name} إلى بطولة`;
      invList.innerHTML = `<p class="muted">جارٍ التحميل…</p>`;
      invModal.hidden = false;
      try {
        const list = await apiFetch("/tournaments");
        const mine = (list || []).filter((t) => me && t.created_by === me.user_id && t.status === "registration_open");
        if (!mine.length) {
          invList.innerHTML = `<p class="muted">لا تنظم أي بطولة مفتوحة للتسجيل حاليًا.</p><a class="btn btn-primary" href="/app/tournaments.html">إنشاء بطولة</a>`;
          return;
        }
        invList.innerHTML = "";
        mine.forEach((t) => {
          const b = document.createElement("button");
          b.className = "st-modal-item";
          b.type = "button";
          b.innerHTML = `<span>${escapeHtml(t.name)}</span><span class="cnt">${(t.participants || []).length}/${t.max_participants} لاعبًا</span>`;
          b.addEventListener("click", () => {
            invModal.hidden = true;
            stShare("دعوة بطولة", `🏆 ${me.display_name} يدعوك للانضمام إلى بطولة «${t.name}» في eFootball Arena — سجّل الآن!`, `${location.origin}/app/tournament.html?id=${t.id}`);
          });
          invList.appendChild(b);
        });
      } catch (err) {
        invList.innerHTML = `<p class="muted">${escapeHtml(err.detail || "تعذر تحميل البطولات")}</p>`;
      }
    }
    el("st-inv-close").addEventListener("click", () => { invModal.hidden = true; });
    invModal.addEventListener("click", (e) => { if (e.target === invModal) invModal.hidden = true; });

    const deckEl = el("st-deck");
    let stSwallow = false;
    deckEl.addEventListener("click", async (e) => {
      if (stSwallow) { stSwallow = false; return; }
      if (e.target.closest("a")) return;
      const btn = e.target.closest("button");
      if (!btn) { stCycle(1); return; }
      if (btn.dataset.act === "next") { stCycle(1); return; }
      const card = stCards.find((c) => c.user_id === btn.dataset.uid);
      if (!card) return;
      if (btn.dataset.act === "like") {
        const span = btn.querySelector("span");
        btn.disabled = true;
        try {
          if (card.liked_by_me) {
            await apiFetch(`/players/${card.user_id}/like`, { method: "DELETE" });
            card.liked_by_me = false; card.likes_count--;
          } else {
            await apiFetch(`/players/${card.user_id}/like`, { method: "POST" });
            card.liked_by_me = true; card.likes_count++;
          }
          btn.classList.toggle("liked", card.liked_by_me);
          btn.firstChild.textContent = card.liked_by_me ? "♥ " : "♡ ";
          span.textContent = card.likes_count;
        } catch (err) {
          toast(err.detail || "تعذر تنفيذ الإعجاب", "error");
        }
        btn.disabled = false;
      } else if (btn.dataset.act === "share") {
        const url = `${location.origin}/app/arena-star.html?player=${card.user_id}`;
        stShare("بطاقة " + card.display_name, `بطاقة اللاعب ${card.display_name} — ELO ${card.rating} في eFootball Arena`, url);
      } else if (btn.dataset.act === "invite-match") {
        const me = stMyCard();
        const url = me ? `${location.origin}/app/arena-star.html?player=${me.user_id}` : `${location.origin}/app/arena-star.html`;
        stShare("دعوة مباراة", `⚔️ ${me ? me.display_name : "لاعب"} يتحدّاك في مباراة eFootball على الساحة! شوف البطاقة وردّ التحدي`, url);
      } else if (btn.dataset.act === "invite-tournament") {
        stOpenInviteModal(card);
      }
    });
    el("st-next").addEventListener("click", () => stCycle(1));
    el("st-prev").addEventListener("click", () => stCycle(-1));
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") stCycle(1);
      if (e.key === "ArrowRight") stCycle(-1);
    });
    let stDragX = null, stDragMoved = false;
    deckEl.addEventListener("pointerdown", (e) => {
      if (e.target.closest("button") || e.target.closest("a")) return;
      stDragX = e.clientX; stDragMoved = false;
      stEls[stOrder[0]].style.transition = "none";
      deckEl.setPointerCapture(e.pointerId);
    });
    deckEl.addEventListener("pointermove", (e) => {
      if (stDragX === null) return;
      const dx = e.clientX - stDragX;
      if (Math.abs(dx) > 8) stDragMoved = true;
      if (stDragMoved) stEls[stOrder[0]].style.transform = `translateX(${dx * 0.45}px) rotate(${dx * 0.04}deg)`;
    });
    deckEl.addEventListener("pointerup", (e) => {
      if (stDragX === null) return;
      const dx = e.clientX - stDragX;
      stDragX = null;
      stSwallow = true;
      const front = stEls[stOrder[0]];
      front.style.transition = "";
      if (!stDragMoved) stCycle(1);
      else if (Math.abs(dx) > 55) stCycle(dx < 0 ? 1 : -1);
      else stLayout();
    });
    deckEl.addEventListener("pointercancel", () => { stDragX = null; stLayout(); });

    (async () => {
      if (!(await requireAuthOrRedirect())) return;
      try {
        stCards = await apiFetch("/players/cards");
      } catch (err) {
        el("st-state").textContent = err.detail || "تعذر تحميل البطاقات";
        return;
      }
      if (!stCards.length) {
        el("st-state").textContent = "لا توجد بطاقات بعد.";
        return;
      }
      el("st-state").hidden = true;
      el("st-wrap").hidden = false;
      stEls = stCards.map((p, i) => {
        const article = document.createElement("article");
        article.className = "st-card";
        article.innerHTML = stCardHtml(p, i);
        deckEl.appendChild(article);
        return article;
      });
      const wanted = new URLSearchParams(location.search).get("player");
      const startAt = wanted ? stCards.findIndex((c) => c.user_id === wanted) : -1;
      const first = startAt >= 0 ? startAt : 0;
      stOrder = stCards.map((_, i) => i);
      if (first > 0) { stOrder = stOrder.slice(first).concat(stOrder.slice(0, first)); }
      stLayout();
      if (stCards.length === 1) {
        toast("أنت النجم الوحيد هنا حتى الآن — شارك بطاقتك ودعُ أصدقاءك للانضمام⭐");
      }
    })();
  </script>
</body>
</html>
