<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1e13" />
  <title>المجتمع — eFootball Arena</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Orbitron:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/shared/theme.css" />
</head>
<body>
  <div class="container community-layout">
    <main>
      <div class="page-heading">
        <div><span class="eyebrow">شبكة اللاعبين</span><h1 class="page-title">المجتمع</h1><p class="muted">شارك لحظاتك وتابع أخبار المنافسين.</p></div>
      </div>
      <section class="card composer-card">
        <div class="section-heading"><h2>ماذا حققت اليوم؟</h2><span class="muted">شارك تحديثًا مع المجتمع</span></div>
        <form id="post-form">
          <label class="sr-only" for="post-content">محتوى المنشور</label>
          <textarea class="field post-composer" id="post-content" maxlength="2000" rows="4" placeholder="اكتب منشورك هنا..." ></textarea>
          <div class="composer-footer">
            <label class="file-label" for="post-image">إضافة صورة<input id="post-image" type="file" accept="image/jpeg,image/png" /></label>
            <span class="muted" id="image-name">JPG أو PNG، حتى 8MB</span>
            <button class="btn btn-primary" type="submit">نشر التحديث</button>
          </div>
          <div id="post-error" class="form-error" role="alert" hidden></div>
        </form>
      </section>
      <section class="feed-section">
        <div class="section-heading"><h2>آخر التحديثات</h2><button class="btn btn-ghost" id="refresh-feed" type="button">تحديث</button></div>
        <div id="feed" aria-live="polite"><div class="spinner"></div></div>
      </section>
    </main>
    <aside class="community-aside">
      <div class="card community-intro">
        <span class="eyebrow">اللعب. التنافس. الانتماء.</span>
        <h2>المنافسة تبدأ من المجتمع</h2>
        <p class="muted">اكتشف نتائج اللاعبين، احتفل بالانتصارات، وابنِ سمعتك داخل الساحة.</p>
        <a class="btn btn-ghost" href="/app/ratings.html">استكشف التصنيف</a>
      </div>
    </aside>
  </div>
  <script src="/shared/api.js"></script>
  <script src="/shared/nav.js"></script>
  <script>
    const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[char]));
    const postTypes = { text: "تحديث", image: "صورة", match_result: "نتيجة مباراة" };
    const formatDate = (value) => new Intl.DateTimeFormat("ar-EG", { dateStyle: "medium", timeStyle: "short" }).format(new Date(value));
    const likedPosts = new Set();

    function renderFeed(posts) {
      el("feed").innerHTML = posts.length ? posts.map((post) => `
        <article class="card post-card" data-post-id="${post.id}">
          <header class="post-header">
            <div class="post-avatar" aria-hidden="true">⚽</div>
            <div><a class="post-author" href="/app/profile.html?user=${encodeURIComponent(post.author_id)}">${escapeHtml(post.author_name || "لاعب eFootball")}</a><div class="muted post-meta">${postTypes[post.post_type] || "تحديث"} · ${formatDate(post.created_at)}</div></div>
          </header>
          ${post.content ? `<p class="post-content">${escapeHtml(post.content)}</p>` : ""}
          ${post.has_image ? `<img class="post-image" src="${API_BASE}/posts/${encodeURIComponent(post.id)}/image" alt="صورة مرفقة بمنشور ${escapeHtml(post.author_name)}" loading="lazy" />` : ""}
          <div class="post-actions">
            <button class="post-action like-button${likedPosts.has(post.id) ? " is-liked" : ""}" type="button" data-action="like" aria-pressed="${likedPosts.has(post.id)}">♥ <span>${post.like_count}</span> إعجاب</button>
            <button class="post-action" type="button" data-action="comments">◌ <span>${post.comment_count}</span> تعليقات</button>
          </div>
          <div class="comments-panel" hidden></div>
        </article>`).join("") : `<div class="empty card">لا توجد تحديثات بعد. كن أول من يشارك إنجازه.</div>`;
      document.querySelectorAll(".post-card").forEach(bindPost);
    }

    async function loadFeed() {
      el("feed").innerHTML = '<div class="spinner"></div>';
      try { renderFeed(await apiFetch("/posts?limit=30")); }
      catch (error) { el("feed").innerHTML = `<div class="empty card" role="alert">${escapeHtml(error.detail || "تعذر تحميل المجتمع.")}</div>`; }
    }

    function bindPost(card) {
      const postId = card.dataset.postId;
      card.querySelector('[data-action="like"]').addEventListener("click", async (event) => {
        const button = event.currentTarget;
        button.disabled = true;
        try {
          const liked = likedPosts.has(postId);
          await apiFetch(`/posts/${postId}/like`, { method: liked ? "DELETE" : "POST" });
          liked ? likedPosts.delete(postId) : likedPosts.add(postId);
          const count = button.querySelector("span");
          count.textContent = String(Number(count.textContent) + (liked ? -1 : 1));
          button.classList.toggle("is-liked", !liked);
          button.setAttribute("aria-pressed", String(!liked));
        } catch (error) { toast(error.detail || "تعذر تحديث الإعجاب.", "error"); }
        finally { button.disabled = false; }
      });
      card.querySelector('[data-action="comments"]').addEventListener("click", async (event) => {
        const panel = card.querySelector(".comments-panel");
        if (!panel.hidden) { panel.hidden = true; return; }
        panel.hidden = false;
        panel.innerHTML = '<div class="muted">جارٍ تحميل التعليقات...</div>';
        try {
          const comments = await apiFetch(`/posts/${postId}/comments`);
          panel.innerHTML = `<div class="comments-list">${comments.length ? comments.map((comment) => `<div class="comment"><strong>${escapeHtml(comment.author_name)}</strong><span>${escapeHtml(comment.content)}</span></div>`).join("") : '<div class="muted">لا توجد تعليقات بعد.</div>'}</div><form class="comment-form"><input class="field" maxlength="1000" required placeholder="اكتب تعليقًا..." aria-label="تعليق جديد" /><button class="btn btn-primary" type="submit">إرسال</button></form>`;
          panel.querySelector("form").addEventListener("submit", async (submitEvent) => {
            submitEvent.preventDefault();
            const input = submitEvent.currentTarget.querySelector("input");
            const button = submitEvent.currentTarget.querySelector("button");
            button.disabled = true;
            try { await apiFetch(`/posts/${postId}/comments`, { method: "POST", body: JSON.stringify({ content: input.value.trim() }) }); input.value = ""; panel.hidden = true; toast("تمت إضافة تعليقك."); }
            catch (error) { toast(error.detail || "تعذر إضافة التعليق.", "error"); }
            finally { button.disabled = false; }
          });
        } catch (error) { panel.innerHTML = `<div class="form-error">${escapeHtml(error.detail || "تعذر تحميل التعليقات.")}</div>`; }
      });
    }

    el("post-image").addEventListener("change", (event) => { el("image-name").textContent = event.target.files[0]?.name || "JPG أو PNG، حتى 8MB"; });
    el("post-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const form = event.currentTarget;
      const button = form.querySelector("button[type=submit]");
      const image = el("post-image").files[0];
      if (image && image.size > 8 * 1024 * 1024) { el("post-error").textContent = "حجم الصورة يتجاوز 8MB."; el("post-error").hidden = false; return; }
      const data = new FormData();
      if (el("post-content").value.trim()) data.append("content", el("post-content").value.trim());
      if (image) data.append("image", image);
      button.disabled = true; el("post-error").hidden = true;
      try { await apiFetch("/posts", { method: "POST", body: data }); form.reset(); el("image-name").textContent = "JPG أو PNG، حتى 8MB"; toast("تم نشر تحديثك."); await loadFeed(); }
      catch (error) { el("post-error").textContent = error.detail || "تعذر نشر التحديث."; el("post-error").hidden = false; }
      finally { button.disabled = false; }
    });
    el("refresh-feed").addEventListener("click", loadFeed);
    if (!Auth.loggedIn()) location.href = "/auth.html?next=" + encodeURIComponent(location.pathname);
    else loadFeed();
  </script>
</body>
</html>
