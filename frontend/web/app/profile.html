<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1e13" />
  <title>ملف اللاعب — eFootball Arena</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Orbitron:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/shared/theme.css" />
</head>
<body>
  <div class="container" style="max-width:800px">
    <div class="card" id="pcard">
      <div class="spinner"></div>
    </div>
  </div>
  <script src="/shared/api.js"></script>
  <script src="/shared/nav.js"></script>
  <script>
    (async () => {
      const uid = new URLSearchParams(location.search).get("user");
      if (!uid) { el("pcard").innerHTML = `<div class="empty">لم يُحدد اللاعب — <a href="/app/ratings.html">اذهب إلى التصنيف</a></div>`; return; }
      try {
        const [p, trust, rating] = await Promise.all([
          apiFetch("/users/" + uid),
          apiFetch("/trust/" + uid).catch(() => null),
          apiFetch("/ratings/" + uid).catch(() => null),
        ]);
        el("pcard").innerHTML = `
          <div class="profile-hero">
            <div class="profile-avatar" aria-hidden="true">⚽</div>
            <div class="profile-identity">
              <span class="eyebrow">ملف اللاعب</span>
              <h1>${escapeHtml(p.display_name)}</h1>
              <div class="muted">${escapeHtml(p.country || "🌍 دولة غير محددة")} · IGN: ${escapeHtml(p.efootball_ign || "—")} · منذ ${new Intl.DateTimeFormat("ar-EG", { dateStyle: "medium" }).format(new Date(p.created_at))}</div>
            </div>
            <div class="profile-rating">
              <div class="stat-value num">${rating ? rating.rating : "—"}</div>
              <div class="stat-label">ELO</div>
            </div>
          </div>
          ${p.bio ? `<p class="profile-bio">${escapeHtml(p.bio)}</p>` : `<p class="profile-bio muted">لم يضف اللاعب نبذة بعد.</p>`}
          <div class="grid cols-3 profile-stats">
            <div class="profile-stat"><span class="stat-label">الثقة</span><strong>${trust ? trust.trust_score : "—"}</strong></div>
            <div class="profile-stat"><span class="stat-label">المباريات</span><strong>${rating ? rating.matches_played : "—"}</strong></div>
            <div class="profile-stat"><span class="stat-label">السجل</span><strong>${rating ? rating.wins + " / " + rating.losses : "—"}</strong></div>
          </div>`;
      } catch (err) {
        el("pcard").innerHTML = `<div class="empty" role="alert">${escapeHtml(err.detail || "تعذر تحميل الملف")}</div>`;
      }
    })();
    const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[char]));
  </script>
</body>
</html>
