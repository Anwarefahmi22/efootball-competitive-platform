<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1e13" />
  <title>التصنيف العام — eFootball Arena</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/shared/theme.css" />
  <link rel="icon" type="image/png" sizes="32x32" href="/shared/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/shared/favicon-192.png" />
  <link rel="apple-touch-icon" href="/shared/favicon-192.png" />
</head>
<body>
  <div class="container">
    <div class="page-heading">
      <div><span class="eyebrow">ساحة المنافسة</span><h1 class="page-title">📊 التصنيف العام</h1><p class="muted">الترتيب: النقاط أولًا، ثم فارق الأهداف، فالأهداف المسجّلة، فتقييم ELO، فعدد الانتصارات.</p></div>
      <label class="search-field" id="search-wrap" for="player-search">بحث عن لاعب<input class="field" id="player-search" type="search" placeholder="اكتب اسم اللاعب…" autocomplete="off" /></label>
    </div>
    <div id="my-rank" class="my-rank" hidden></div>
    <section id="podium" class="podium" hidden aria-label="منصة التتويج"></section>
    <div class="card leaderboard-card">
      <table class="table">
        <caption class="sr-only">جدول التصنيف العام للاعبي المنصة</caption>
        <thead><tr><th>#</th><th>اللاعب</th><th>نقاط</th><th>فارق الأهداف</th><th>أهداف له</th><th>أهداف عليه</th><th>ELO</th><th>لعب</th><th>فاز</th><th>تعادل</th><th>خسر</th></tr></thead>
        <tbody id="body"></tbody>
      </table>
    </div>
  </div>
  <script src="/shared/i18n.js"></script>
  <script src="/shared/api.js"></script>
  <script src="/shared/nav.js"></script>
  <script src="/shared/presence.js"></script>
  <script>
    const PODIUM_ART = `<svg class="board-empty__art" viewBox="0 0 200 108" aria-hidden="true"><g fill="none" stroke="#a3ff12" stroke-width="2"><circle cx="55" cy="34" r="13" stroke-opacity=".45" stroke-dasharray="4 5"/><circle cx="100" cy="22" r="15"/><circle cx="145" cy="40" r="12" stroke-opacity=".3" stroke-dasharray="4 5"/></g><g fill="#143325" stroke="#1f4a33"><rect x="76" y="58" width="48" height="42" rx="4"/><rect x="28" y="72" width="44" height="28" rx="4"/><rect x="128" y="78" width="44" height="22" rx="4"/></g><g fill="#a3ff12" font-family="IBM Plex Sans Arabic, sans-serif" font-weight="800" text-anchor="middle"><text x="100" y="86" font-size="17">1</text><text x="50" y="92" font-size="13" fill-opacity=".55">2</text><text x="150" y="95" font-size="12" fill-opacity=".4">3</text></g></svg>`;
    const titleFor = (elo) => elo >= 1300 ? "أسطورة الساحة" : elo >= 1150 ? "محترف الساحة" : elo >= 1050 ? "منافس شرس" : elo >= 950 ? "منافس" : "صاعد";
    /* AUD-34: named loader with an explicit loading state and a retry
       path — the page used to be a one-shot IIFE whose failure row
       offered no way back. */
    async function loadRatings() {
      el("body").innerHTML = `<tr><td colspan="11" class="empty"><div class="spinner"></div> جارٍ تحميل التصنيف…</td></tr>`;
      try {
        // The viewer's id comes from /auth/me directly: the localStorage
        // copy is only written by some pages, so relying on it left the
        // my-rank chip and row highlight missing for most sessions.
        const [rows, me] = await Promise.all([
          apiFetch("/ratings/leaderboard"),
          apiFetch("/auth/me").catch(() => null),
        ]);
        const search = el("player-search");
        const myId = me?.id;
        const initials = (name) => escapeHtml((name || "EA").trim().slice(0, 2).toUpperCase());
        if (!rows.length) {
          el("search-wrap").hidden = true;
          el("body").innerHTML = `<tr><td colspan="11" class="board-empty">${PODIUM_ART}<strong class="board-empty__title">العرش بانتظار صاحبه</strong><span>لا توجد مباريات موثقة بعد — العب مباراة موثقة وستظهر هنا في التصنيف العالمي.</span><br /><a class="btn btn-primary" href="/app/tournaments.html" style="margin-top:12px">استكشف البطولات</a></td></tr>`;
          return;
        }
        // A: podium for the top three (winner raised in the middle)
        if (rows.length >= 3) {
          const [first, second, third] = rows;
          const card = (r, rank, cls, p, ring) => `
            <article class="podium-card ${cls}">
              <span class="podium-rank"><span class="medal m${rank}"></span>#${rank}</span>
              <span class="avatar-ring is-round" style="--p:${p};--ring:${ring}"><span class="podium-avatar">${initials(r.display_name)}</span></span>
              <a class="player-link podium-name" href="/app/profile.html?user=${encodeURIComponent(r.user_id)}">${escapeHtml(r.display_name)}</a>
              ${rank === 1 ? `<span class="podium-title">${titleFor(r.rating)}</span>` : ""}
              <span class="podium-points"><b>${r.points}</b> نقاط</span>
              <span class="podium-meta">${r.rating} ELO · لعب ${r.matches_played}</span>
            </article>`;
          el("podium").innerHTML = card(second, 2, "", 70, "#cfd8d3") + card(first, 1, "first", 100, "#a3ff12") + card(third, 3, "", 45, "#cd8f52");
          el("podium").hidden = false;
        }
        // C: my-rank chip
        const myIndex = rows.findIndex((r) => r.user_id === myId);
        if (myIndex >= 0) {
          const me = rows[myIndex];
          el("my-rank").innerHTML = `<span>ترتيبك الحالي: <b>#${myIndex + 1}</b></span><span>${me.points} نقاط · ${me.rating} ELO</span><a href="/app/profile.html?user=${encodeURIComponent(myId)}">افتح ملفك</a>`;
          el("my-rank").hidden = false;
        }
        const render = (entries) => el("body").innerHTML = entries.map(({ r, rank }) => `
          <tr${r.user_id === myId ? ' class="is-me"' : ""}>
            <td class="num">${rank <= 3 ? `<span class="medal m${rank}"></span>` : ""}${rank}</td>
            <td><a class="player-link" href="/app/profile.html?user=${encodeURIComponent(r.user_id)}">${escapeHtml(r.display_name)}</a></td>
            <td class="num accent-text">${r.points}</td>
            <td class="num">${r.goal_difference > 0 ? "+" : ""}${r.goal_difference}</td>
            <td>${r.goals_for}</td>
            <td>${r.goals_against}</td>
            <td class="num accent-text">${r.rating}</td>
            <td>${r.matches_played}</td>
            <td class="accent-text">${r.wins}</td>
            <td>${r.draws}</td>
            <td class="danger-text">${r.losses}</td>
          </tr>`).join("") || `<tr><td colspan="11" class="empty">لا توجد نتائج مطابقة.</td></tr>`;
        const all = rows.map((r, i) => ({ r, rank: i + 1 }));
        render(all);
        search.addEventListener("input", () => {
          const term = search.value.trim().toLocaleLowerCase();
          render(all.filter(({ r }) => r.display_name.toLocaleLowerCase().includes(term)));
        });
      } catch (err) {
        el("body").innerHTML = `<tr><td colspan="11" class="empty" role="alert">${escapeHtml(err.detail || "تعذر التحميل")}<br /><button class="btn btn-ghost" type="button" id="retry-ratings" style="margin-top:10px">إعادة المحاولة</button></td></tr>`;
        el("retry-ratings")?.addEventListener("click", loadRatings);
      }
    }
    loadRatings();
  </script>
</body>
</html>
