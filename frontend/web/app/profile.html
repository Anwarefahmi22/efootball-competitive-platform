<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1e13" />
  <title>ملف اللاعب — eFootball Arena</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/shared/theme.css" />
  <link rel="icon" type="image/png" sizes="32x32" href="/shared/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/shared/favicon-192.png" />
  <link rel="apple-touch-icon" href="/shared/favicon-192.png" />
</head>
<body>
  <div class="container profile-page">
    <a class="back-link" href="/app/ratings.html">← العودة إلى التصنيف</a>
    <div class="card profile-shell" id="pcard">
      <div class="spinner"></div>
    </div>
  </div>
  <script src="/shared/i18n.js"></script>
  <script src="/shared/api.js"></script>
  <script src="/shared/nav.js"></script>
  <script>
    (async () => {
      const uid = new URLSearchParams(location.search).get("user");
      if (!uid) { el("pcard").innerHTML = `<div class="empty" role="alert"><div class="empty-arena-mark" aria-hidden="true">👤</div><h2>لم يُحدد اللاعب</h2><p class="muted">افتح ملف اللاعب من صفحة التصنيف أو من روابط المجتمع.</p><a class="btn btn-primary" href="/app/ratings.html">العودة إلى التصنيف</a></div>`; return; }
      if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(uid)) {
        el("pcard").innerHTML = `<div class="empty" role="alert"><h2>رابط الملف غير صالح</h2><p class="muted">افتح ملف اللاعب من صفحة التصنيف لاستخدام معرّف صحيح.</p><a class="btn btn-primary" href="/app/ratings.html">العودة إلى التصنيف</a></div>`;
        return;
      }
      try {
        const [p, trust, rating, leaderboard, fstats, me] = await Promise.all([
          apiFetch("/users/" + uid),
          apiFetch("/trust/" + uid).catch(() => null),
          apiFetch("/ratings/" + uid).catch(() => null),
          apiFetch("/ratings/leaderboard").catch(() => []),
          apiFetch("/users/" + uid + "/follow-stats").catch(() => null),
          apiFetch("/auth/me").catch(() => null),
        ]);
        const rank = rating ? leaderboard.findIndex((row) => row.user_id === uid) + 1 : 0;
        const matches = rating?.matches_played || 0;
        const wins = rating?.wins || 0;
        const draws = rating?.draws || 0;
        const losses = rating?.losses || 0;
        const winRate = matches ? Math.round((wins / matches) * 100) : 0;
        const trustScore = trust?.trust_score ?? 0;
        const initials = escapeHtml((p.display_name || "EA").trim().slice(0, 2).toUpperCase());
        const titleFor = (elo) => elo >= 1300 ? "أسطورة الساحة" : elo >= 1150 ? "محترف الساحة" : elo >= 1050 ? "منافس شرس" : elo >= 950 ? "منافس" : "صاعد";
        const isOwn = Boolean(me && me.id === uid);
        const missingFields = [["نبذة تعريفية", p.bio], ["الدولة", p.country], ["IGN", p.efootball_ign], ["صورة شخصية", p.avatar_url]].filter(([, v]) => !v).map(([label]) => label);
        const completeness = 100 - missingFields.length * 25;
        const joined = new Intl.DateTimeFormat(i18n.current() === "ar" ? "ar-EG" : i18n.current(), { dateStyle: "medium" }).format(new Date(p.created_at));
        el("pcard").innerHTML = `
          <div class="profile-cover">
            <svg class="identity-pitch" viewBox="0 0 400 260" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><g fill="none" stroke="#a3ff12" stroke-width="2"><rect x="14" y="14" width="372" height="232" rx="6"/><line x1="200" y1="14" x2="200" y2="246"/><circle cx="200" cy="130" r="44"/><circle cx="200" cy="130" r="3" fill="#a3ff12"/><path d="M14 84 h52 v92 h-52"/><path d="M386 84 h-52 v92 h52"/></g></svg>
            <div class="profile-cover__glow"></div>
            <div class="profile-hero">
              <span class="avatar-ring profile-ring" style="--p:${trustScore}"><span class="profile-avatar${p.avatar_url ? " has-image" : ""}" aria-label="الصورة الشخصية">
                ${p.avatar_url ? `<img src="${escapeHtml(p.avatar_url)}" alt="صورة ${escapeHtml(p.display_name)}">` : `<span data-i18n-skip>${initials}</span>`}
              </span></span>
              <div class="profile-identity">
                <div class="profile-status"><i></i> لاعب نشط</div>
                <h1 data-i18n-skip>${escapeHtml(p.display_name)}</h1>
                ${rating ? `<span class="title-chip">${titleFor(rating.rating)}</span>` : ""}
                <div class="muted">${p.country ? `<span data-i18n-skip>${escapeHtml(p.country)}</span>` : '<span class="blank-chip">🌍 دولة غير محددة</span>'} <span class="profile-dot">•</span> ${p.efootball_ign ? `<span data-i18n-skip>IGN: ${escapeHtml(p.efootball_ign)}</span>` : '<span class="blank-chip">IGN غير مضاف</span>'}</div>
                ${me && me.id === uid ? `<div class="muted" data-i18n-skip>✉ ${escapeHtml(me.email || "")}</div>` : ""}
              </div>
              ${me && me.id !== uid ? `<div class="profile-follow"><button class="btn btn-primary" id="follow-btn" type="button">متابعة</button></div>` : ""}
              <div class="profile-rating">
                <span class="profile-rating__label">التقييم الحالي</span>
                <strong class="num">${rating ? rating.rating : "—"}</strong>
                <span class="profile-rating__suffix">ELO</span>
              </div>
            </div>
            <div class="profile-cover__meta"><span>عضو منذ ${joined}</span><span>${rank ? `المرتبة #${rank}` : "لم يدخل التصنيف بعد"}</span></div>
          </div>
          ${isOwn ? `<div class="profile-complete">
            <div class="profile-complete__head"><strong>اكتمال الملف</strong><span class="num">${completeness}%</span></div>
            <div class="progress" role="progressbar" aria-label="اكتمال الملف" aria-valuenow="${completeness}" aria-valuemin="0" aria-valuemax="100"><i style="width:${completeness}%"></i></div>
            ${missingFields.length ? `<p class="muted"><span>ينقصك:</span> ${missingFields.map((label) => `<span>${label}</span>`).join("، ")}</p><a class="btn btn-ghost" href="/app/dashboard.html">أكمل ملفك</a>` : `<p class="profile-complete__done">✓ ملفك مكتمل بالكامل</p>`}
          </div>` : ""}
          <div class="profile-intro">
            <div>
              <h2>هوية اللاعب</h2>
              <p class="profile-bio"${p.bio ? " data-i18n-skip" : ""}>${escapeHtml(p.bio || "هذا اللاعب لم يضف نبذة تعريفية بعد.")}</p>
            </div>
            <div class="profile-badge">⚡ تنافسي<br><small>جاهز للمواجهة</small></div>
          </div>
          <div class="profile-metric-strip" aria-label="إحصائيات اللاعب">
            <div><span>المباريات</span><strong>${matches}</strong></div>
            <div><span>الانتصارات</span><strong class="accent-text">${wins}</strong></div>
            <div><span>الخسائر</span><strong class="danger-text">${losses}</strong></div>
            <div><span>نسبة الفوز</span><strong>${winRate}%</strong></div>
            <div><span>المتابعون</span><strong id="followers-count">${fstats?.followers_count ?? 0}</strong></div>
            <div><span>أتابع</span><strong id="following-count">${fstats?.following_count ?? 0}</strong></div>
          </div>
          ${p.squad_image_url ? `<section class="profile-panel" style="margin-bottom:14px"><div class="section-heading"><h2>تشكيلة اللاعب</h2>${p.formation ? `<span class="badge open">${escapeHtml(p.formation)}${p.squad_strength ? ` · القوة ${p.squad_strength}` : ""}</span>` : ""}</div><img src="${escapeHtml(p.squad_image_url)}" alt="تشكيلة اللاعب" loading="lazy" style="width:100%;border-radius:12px;display:block" /></section>` : ""}
          <div class="profile-panels">
            <section class="profile-panel">
              <div class="section-heading"><h2>مؤشر الثقة</h2><span class="badge open">${trustScore >= 80 ? "موثوق" : trustScore >= 50 ? "مقبول" : "جديد"}</span></div>
              <div class="trust-score"><strong class="num">${trust ? trustScore : "—"}</strong><span>/ 100</span></div>
              <div class="progress profile-progress" role="progressbar" aria-label="درجة الثقة" aria-valuenow="${trustScore}" aria-valuemin="0" aria-valuemax="100"><i style="width:${trustScore}%"></i></div>
              <p class="muted">تُبنى الثقة من الالتزام بالمواعيد وتأكيد نتائج المباريات.</p>
            </section>
            <section class="profile-panel">
              <div class="section-heading"><h2>سجل المنافسة</h2><span class="panel-icon">↗</span></div>
              <div class="record-blocks">
                <div><strong class="accent-text">${wins}</strong><span>فوز</span></div>
                <div><strong>${draws}</strong><span>تعادل</span></div>
                <div><strong class="danger-text">${losses}</strong><span>خسارة</span></div>
              </div>
              <div class="record-line"><span>نسبة الفوز</span><strong>${winRate}%</strong></div>
              <div class="progress profile-progress"><i style="width:${winRate}%"></i></div>
              <div class="record-line"><span>التقييم</span><strong>${rating ? rating.rating : "—"} ELO</strong></div>
              <p class="muted">واصل اللعب لرفع ترتيبك في الساحة.</p>
            </section>
            <section class="profile-panel profile-community grid-span" aria-labelledby="pc-posts-title">
              <div class="section-heading"><h2 id="pc-posts-title">آخر منشورات اللاعب</h2><a class="panel-icon" href="/app/community.html" aria-label="فتح الساحة">↗</a></div>
              <div id="pc-posts"><div class="muted">جارٍ تحميل المنشورات…</div></div>
            </section>
          </div>
          <div class="profile-footer">
            <span class="muted">ملف عام للاعب في eFootball Arena</span>
            <a class="btn btn-ghost" href="/app/tournaments.html">استكشف البطولات</a>
          </div>`;
        loadPlayerPosts(uid);
        // Follow/unfollow wiring (QA audit 2026-10-31: the social API
        // existed but no UI surface reached it). Stats are re-fetched
        // after each toggle so the counters never drift from the server.
        const followBtn = el("follow-btn");
        if (followBtn && fstats) {
          let current = fstats;
          const paint = () => {
            followBtn.textContent = current.is_following ? "إلغاء المتابعة" : "متابعة";
            followBtn.classList.toggle("btn-primary", !current.is_following);
            followBtn.classList.toggle("btn-ghost", current.is_following);
          };
          paint();
          followBtn.addEventListener("click", async () => {
            followBtn.disabled = true;
            try {
              await apiFetch("/users/" + uid + "/follow", { method: current.is_following ? "DELETE" : "POST", noBody: true });
              current = await apiFetch("/users/" + uid + "/follow-stats");
              el("followers-count").textContent = current.followers_count;
              el("following-count").textContent = current.following_count;
              paint();
            } catch (e) { toast(e.detail || "تعذر تحديث المتابعة.", "error"); }
            finally { followBtn.disabled = false; }
          });
        }
      } catch (err) {
        el("pcard").innerHTML = `<div class="empty" role="alert">${escapeHtml(err.detail || "تعذر تحميل الملف")}</div>`;
      }
    })();
    async function loadPlayerPosts(uid) {
      const box = el("pc-posts");
      if (!box) return;
      try {
        const posts = await apiFetch(`/posts?author_id=${encodeURIComponent(uid)}&limit=5`);
        if (!posts.length) {
          box.innerHTML = '<div class="profile-posts-empty"><div class="empty-arena-mark" aria-hidden="true">✦</div><p class="muted">لا توجد منشورات لهذا اللاعب بعد.</p></div>';
          return;
        }
        const postTypes = {
          match_result: "نتيجة موثقة",
          achievement: "إنجاز",
          tournament: "بطولة",
          image: "صورة",
          text: "تحديث",
          general: "عام",
        };
        box.innerHTML = `<ul class="record-list">${posts.map((post) => {
          const text = (post.content || "").trim().slice(0, 90) || "منشور";
          return `<li class="record-line"><span data-i18n-skip>${escapeHtml(text)}</span><strong>${postTypes[post.post_type] || "تحديث"}</strong></li>`;
        }).join("")}</ul>`;
      } catch (err) {
        box.innerHTML = '<p class="muted">تعذر تحميل المنشورات.</p>';
      }
    }

    const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[char]));
  </script>
</body>
</html>
